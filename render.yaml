# Render Blueprint — HiredeskHR Backend Services
# See: https://docs.render.com/blueprint-spec

services:
  # ── API Web Service ────────────────────────────────────────────────────
  - type: web
    name: hiredesk-api
    runtime: node
    region: singapore  # Change to your preferred region
    plan: free         # free | starter | standard
    buildCommand: |
      npm install &&
      npx prisma generate --schema=packages/database/prisma/schema.prisma &&
      npm run build --workspace=@hiredesk/shared &&
      npm run build --workspace=@hiredesk/database &&
      npm run build --workspace=@hiredesk/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false  # Set to your Vercel frontend URL (e.g., https://hiredesk.vercel.app)
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false  # Supabase pooled connection string
      - key: DIRECT_URL
        sync: false  # Supabase direct connection string
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: BOOTSTRAP_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false  # Your Vercel frontend URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

  # ── IMAP Email Worker (Background) ─────────────────────────────────────
  - type: worker
    name: hiredesk-worker
    runtime: node
    region: singapore
    plan: free
    buildCommand: |
      npm install &&
      npx prisma generate --schema=packages/database/prisma/schema.prisma &&
      npm run build --workspace=@hiredesk/shared &&
      npm run build --workspace=@hiredesk/database &&
      npm run build --workspace=@hiredesk/worker
    startCommand: node apps/worker/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_PORT
        sync: false
      - key: IMAP_SECURE
        sync: false
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: IMAP_MAILBOX
        value: INBOX
      - key: IMAP_POLL_INTERVAL_MS
        value: "30000"
      - key: IMAP_MAX_RETRIES
        value: "8"
      - key: INBOUND_MAILBOX_ID
        sync: false
