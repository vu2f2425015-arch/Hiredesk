<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiredeskHR — Multi-Tenant Recruitment Agency ATS</title>
    <meta
      name="description"
      content="Manage agency vacancies, applications, candidate records, and client reviews in one recruitment workspace."
    />
    <meta name="theme-color" content="#0a0d14" id="theme-color-meta" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HiredeskHR — Multi-Tenant Recruitment Agency ATS" />
    <meta
      property="og:description"
      content="Manage agency vacancies, applications, candidate records, and client reviews in one recruitment workspace."
    />
    <meta property="og:site_name" content="HiredeskHR" />
    <meta property="og:image" content="/og-preview.svg" />

    <!-- Twitter Social Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HiredeskHR — Recruitment Agency ATS" />
    <meta
      name="twitter:description"
      content="Manage agency vacancies, applications, candidate records, and client reviews in one recruitment workspace."
    />
    <meta name="twitter:image" content="/og-preview.svg" />

    <!-- Keep theme initialization external so the static site can use a strict script CSP. -->
    <script src="/theme-init.js"></script>

    <!-- Google Fonts with Preconnect and Display Swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
